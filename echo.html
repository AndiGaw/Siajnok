<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">
<title>Echo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* ===== STYL BAZOWY ===== */
    html, body {
        margin: 0; padding: 0; 
        height: 100vh; 
        background-color: #000;
        /* Tło sciana.png */
        background-image: url('sciana.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #e6c47a; 
        font-family: "Georgia", serif;
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
        align-items: center;
        position: relative;
        width: 100%;
    }

    /* ===== ALERT MODAL ===== */
    #custom-modal {
        display: none; 
        position: fixed; 
        z-index: 100; 
        left: 0; top: 0; 
        width: 100%; height: 100%; 
        background: rgba(0,0,0,0.85); 
        backdrop-filter: blur(2px); 
        justify-content: center; 
        align-items: center; 
    }
    
    #modal-content {
        background-color: #111;
        border: 3px solid #e6c47a;
        box-shadow: 0 0 30px rgba(230,196,122,0.4);
        padding: 40px;
        text-align: center;
        max-width: 450px;
        width: 85%;
        border-radius: 15px;  
    }
    
    #modal-text {
        font-size: 1.5em;
        color: #e6c47a;
        text-shadow: 0 0 10px rgba(230,196,122,0.3);
    }

    /* ===== ANIMACJE TRZĘSIENIA (Dla Zapadni) ===== */
    @keyframes violent-shake {
        0% { transform: translate(0, 0) rotate(0deg); }
        10% { transform: translate(-5px, -5px) rotate(-1deg); }
        20% { transform: translate(5px, 5px) rotate(1deg); }
        30% { transform: translate(-5px, 5px) rotate(0deg); }
        40% { transform: translate(5px, -5px) rotate(1deg); }
        50% { transform: translate(-5px, -5px) rotate(-1deg); }
        60% { transform: translate(5px, 5px) rotate(0deg); }
        70% { transform: translate(-5px, 5px) rotate(-1deg); }
        80% { transform: translate(5px, -5px) rotate(1deg); }
        90% { transform: translate(-5px, -5px) rotate(0deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shake-active {
        animation: violent-shake 0.5s infinite;
    }

    /* ===== SAND EFFECT ===== */
    .sand { 
        position: fixed; width: 100%; height: 100%; 
        background: repeating-linear-gradient(45deg, rgba(230,196,122,0.05), rgba(0,0,0,0) 6px); 
        pointer-events: none; z-index: 1; 
    }

    /* ===== UI ELEMENTS ===== */
    #top-controls { 
        position: relative; 
        z-index: 10; 
        margin-top: 40px; 
        margin-bottom: 20px;
    }
    
    .ui-btn { 
        font-size: 1.2em; 
        padding: 10px 20px; 
        background: #111; 
        color: #e6c47a; 
        border: 2px solid #e6c47a; 
        cursor: pointer; 
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        transition: 0.3s;
    }

    /* Zmiana układu głównego */
    .main-layout { 
        display: flex; 
        flex-direction: column; /* Zmiana na kolumnę - inputy pod narratorem */
        align-items: center; 
        justify-content: center; 
        position: relative; /* Ważne dla pozycjonowania Glifa */
        width: 100%;
        height: 60vh; /* Obszar roboczy dla elementów */
        z-index: 5; 
        padding: 20px; 
    }

    /* Styl przycisku Glif - ZMODYFIKOWANY */
    #echo-btn {
        width: 150px; 
        height: 150px; 
        border-radius: 50%; 
        border: 6px double #e6c47a;
        background: #1a1a1a; 
        color: #e6c47a; 
        font-size: 1.5em; 
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer; 
        transition: 0.3s ease;
        box-shadow: 0 0 20px rgba(230, 196, 122, 0.2);
        
        /* Pozycjonowanie absolutne */
        position: absolute;
        
        /* Przesunięcie w lewo o 30% od środka (50% - 30% = 20%) */
        left: 20%; 
        
        /* Przesunięcie w górę o 5% (bazując na środku wysokości) */
        top: 45%; 
        transform: translateY(-50%); /* Centrowanie względem własnej osi */
        
        order: unset; /* Order niepotrzebny przy position: absolute */
    }

    /* Styl zablokowanego przycisku */
    #echo-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        border-color: #555;
        color: #555;
        box-shadow: none;
        filter: grayscale(100%);
    }

    #echo-btn:active:not(:disabled) {
        transform: translateY(-50%) scale(0.95); /* Zachowujemy przesunięcie Y przy kliknięciu */
        box-shadow: 0 0 5px rgba(230, 196, 122, 0.5);
    }

    /* Kontener inputów - ZMODYFIKOWANY */
    .inputs-container { 
        display: flex; 
        gap: 15px; 
        order: unset;
        
        /* Przesunięcie w górę o 5% (vh = viewport height) */
        transform: translateY(-5vh);
        
        margin-top: 40px; /* Dodatkowy odstęp od góry */
    }
    
    .code-input { 
        width: 60px; 
        height: 80px; 
        background: rgba(0, 0, 0, 0.8); 
        border: 3px solid #5a4422; 
        color: #e6c47a; 
        font-size: 3em; 
        text-align: center; 
        border-radius: 8px; 
        outline: none;
        text-transform: lowercase;
        transition: 0.3s;
    }

    /* Zablokowane pola */
    .code-input:disabled {
        background: rgba(0,0,0,0.5);
        border-color: #333;
        color: #555;
        cursor: not-allowed;
    }

    .code-input:focus {
        border-color: #e6c47a;
        box-shadow: 0 0 15px rgba(230, 196, 122, 0.5);
    }

    #flash { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #000; opacity: 0; pointer-events: none; z-index: 100; 
        transition: opacity 2s; 
    }
    
</style>
</head>
<body id="body-main">

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PB6TX54M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div class="sand"></div>
<div id="flash"></div>

<div id="custom-modal">
    <div id="modal-content">
        <div id="modal-text">Komunikat</div>
    </div>
</div>

<div id="top-controls">
    <button id="narratorBtn" data-umami-event="Echo Narrator" class="ui-btn" onclick="playNarrator()">🎙️ Narrator (Start)</button>
</div>

<div class="main-layout">
    <button id="echo-btn" disabled data-umami-event="Echo Szyfr" onclick="toggleGlif()">Glif</button>

    <div class="inputs-container">
        <input type="text" class="code-input" maxlength="1" disabled data-index="0">
        <input type="text" class="code-input" maxlength="1" disabled data-index="1">
        <input type="text" class="code-input" maxlength="1" disabled data-index="2">
        <input type="text" class="code-input" maxlength="1" disabled data-index="3">
    </div>
</div>

<audio id="zapadniaSound"><source src="Zapadnia.mp3" type="audio/mpeg"></audio>
<audio id="glosSound"><source src="Glos_Serca_Siczy.mp3" type="audio/mpeg"></audio>

<script>
    let narratorAudio = null;
    let glifAudio = null;
    const inputs = document.querySelectorAll('.code-input');
    const body = document.getElementById('body-main');
    const glifBtn = document.getElementById('echo-btn');

    // --- 1. Obsługa Narratora ---
    function playNarrator() {
        const btn = document.getElementById("narratorBtn");
        if (!narratorAudio) {
            narratorAudio = new Audio("Zaglebienie.mp3");
            
            // Kiedy Narrator skończy -> odblokuj Glif
            narratorAudio.onended = () => { 
                btn.innerText = "🎙️ Narrator (Koniec)"; 
                glifBtn.disabled = false; // Odblokowanie Glifa
                glifBtn.style.opacity = "1";
                // Opcjonalnie: animacja pulsowania, żeby zwrócić uwagę
                glifBtn.style.boxShadow = "0 0 40px rgba(230, 196, 122, 0.6)";
            };
        }

        if (narratorAudio.paused) {
            narratorAudio.play().then(() => btn.innerText = "⏸️ Narrator (Pauza)").catch(() => alert("Brak pliku Zaglebienie.mp3!"));
        } else {
            narratorAudio.pause(); btn.innerText = "▶️ Narrator (Wznów)";
        }
    }

    // --- 2. Obsługa Glifa (Play/Pause + Odblokowanie inputów) ---
    function toggleGlif() {
        if (!glifAudio) {
            glifAudio = document.getElementById('glosSound');
            
            // Kiedy Glif skończy -> odblokuj Inputy
            glifAudio.onended = () => {
                glifBtn.innerText = "Glif";
                enableInputs();
            };
        }

        if (glifAudio.paused) {
            glifAudio.play();
            glifBtn.innerText = "Pauza";
        } else {
            glifAudio.pause();
            glifBtn.innerText = "Wznów";
        }
    }

    function enableInputs() {
        inputs.forEach(input => {
            input.disabled = false;
            input.style.borderColor = "#e6c47a"; // Wizualne potwierdzenie aktywacji
        });
        // Ustawienie fokusu na pierwszym polu
        inputs[0].focus();
    }

    // --- 3. Logika Inputów ---
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.toLowerCase();
            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            checkCode();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && input.value === "" && index > 0) {
                inputs[index - 1].focus();
            }
        });
        
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasteData = (e.clipboardData || window.clipboardData).getData('text').toLowerCase();
            let currentIndex = index;
            for (let char of pasteData) {
                if (currentIndex < inputs.length) {
                    inputs[currentIndex].value = char;
                    currentIndex++;
                }
            }
            checkCode();
            if (currentIndex < inputs.length) inputs[currentIndex].focus();
        });
    });

    // --- 4. Sprawdzanie hasła ---
    function checkCode() {
        const code = Array.from(inputs).map(i => i.value).join('');
        if (code === "okon" || code === "okoń") {
            triggerSuccess();
        }
    }

    // --- 5. Sekwencja Końcowa ---
    function triggerSuccess() {
        // Blokada interfejsu (natychmiast)
        inputs.forEach(i => i.disabled = true);
        glifBtn.disabled = true;
        
        // 1. Audio Zapadni (Start: natychmiast, T=0s)
        const zapadniaAudio = document.getElementById('zapadniaSound');
        if (zapadniaAudio) {
            zapadniaAudio.play().catch(e => console.log("Błąd audio zapadni:", e));
        }

        // 2. Trzęsienie ekranu (Start: po 7s)
        setTimeout(() => {
            body.classList.add('shake-active');
        }, 7000);
        
        // 3. Ciemność (Start: po 15s od początku, czyli 8s po trzęsieniu)
        setTimeout(() => {
            document.getElementById('flash').style.opacity = "1";
        }, 15000);

        // 4. Przekierowanie (Start: po 45s)
        setTimeout(() => { 
            window.location.href = "https://andigaw.github.io/Siajnok/ekstrakt.html"; 
        }, 45000); 
    }
</script>
</body>
</html>
