<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">
<title>Echo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* ===== STYL BAZOWY ===== */
    html, body {
        margin: 0; padding: 0; 
        height: 100vh; 
        background-color: #000;
        /* Tło sciana.png */
        background-image: url('sciana.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #e6c47a; 
        font-family: "Georgia", serif;
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
        align-items: center;
        position: relative;
        width: 100%;
    }

    /* ===== ALERT MODAL ===== */
    #custom-modal {
        display: none; 
        position: fixed; 
        z-index: 100; 
        left: 0; top: 0; 
        width: 100%; height: 100%; 
        background: rgba(0,0,0,0.85); 
        backdrop-filter: blur(2px); 
        justify-content: center; 
        align-items: center; 
    }
    
    #modal-content {
        background-color: #111;
        border: 3px solid #e6c47a;
        box-shadow: 0 0 30px rgba(230,196,122,0.4);
        padding: 40px;
        text-align: center;
        max-width: 450px;
        width: 85%;
        border-radius: 15px;  
    }
    
    #modal-text {
        font-size: 1.5em;
        color: #e6c47a;
        text-shadow: 0 0 10px rgba(230,196,122,0.3);
    }

    /* ===== ANIMACJE TRZĘSIENIA (Dla Zapadni) ===== */
    @keyframes violent-shake {
        0% { transform: translate(0, 0) rotate(0deg); }
        10% { transform: translate(-5px, -5px) rotate(-1deg); }
        20% { transform: translate(5px, 5px) rotate(1deg); }
        30% { transform: translate(-5px, 5px) rotate(0deg); }
        40% { transform: translate(5px, -5px) rotate(1deg); }
        50% { transform: translate(-5px, -5px) rotate(-1deg); }
        60% { transform: translate(5px, 5px) rotate(0deg); }
        70% { transform: translate(-5px, 5px) rotate(-1deg); }
        80% { transform: translate(5px, -5px) rotate(1deg); }
        90% { transform: translate(-5px, -5px) rotate(0deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shake-active {
        animation: violent-shake 0.5s infinite;
    }

    /* ===== SAND EFFECT ===== */
    .sand { 
        position: fixed; width: 100%; height: 100%; 
        background: repeating-linear-gradient(45deg, rgba(230,196,122,0.05), rgba(0,0,0,0) 6px); 
        pointer-events: none; z-index: 1; 
    }

    /* ===== UI ELEMENTS ===== */
    #top-controls { 
        position: relative; 
        z-index: 10; 
        margin-top: 40px; 
    }
    
    .ui-btn { 
        font-size: 1.2em; 
        padding: 10px 20px; 
        background: #111; 
        color: #e6c47a; 
        border: 2px solid #e6c47a; 
        cursor: pointer; 
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .main-layout { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        gap: 40px; /* Odstęp między Glifem a Inputami */
        z-index: 5; 
        padding: 20px; 
        margin-top: auto; 
        margin-bottom: auto;
    }

    /* Styl przycisku Glif */
    #echo-btn {
        width: 150px; 
        height: 150px; 
        border-radius: 50%; 
        border: 6px double #e6c47a;
        background: #1a1a1a; 
        color: #e6c47a; 
        font-size: 1.5em; 
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer; 
        transition: 0.3s ease;
        box-shadow: 0 0 20px rgba(230, 196, 122, 0.2);
    }

    #echo-btn:active {
        transform: scale(0.95);
        box-shadow: 0 0 5px rgba(230, 196, 122, 0.5);
    }

    .inputs-container { 
        display: flex; 
        gap: 15px; 
    }
    
    .code-input { 
        width: 60px; 
        height: 80px; 
        background: rgba(0, 0, 0, 0.8); 
        border: 3px solid #5a4422; 
        color: #e6c47a; 
        font-size: 3em; 
        text-align: center; 
        border-radius: 8px; 
        outline: none;
        /* Zmiana na małe litery w CSS */
        text-transform: lowercase;
        transition: 0.3s;
    }

    .code-input:focus {
        border-color: #e6c47a;
        box-shadow: 0 0 15px rgba(230, 196, 122, 0.5);
    }

    #flash { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #000; opacity: 0; pointer-events: none; z-index: 100; 
        transition: opacity 3s; 
    }
    
</style>
</head>
<body id="body-main">

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PB6TX54M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div class="sand"></div>
<div id="flash"></div>

<div id="custom-modal">
    <div id="modal-content">
        <div id="modal-text">Komunikat</div>
    </div>
</div>

<div id="top-controls">
    <button id="narratorBtn" data-umami-event="Echo Narrator" class="ui-btn" onclick="playNarrator()">🎙️ Narrator (Start)</button>
</div>

<div class="main-layout">
    <button id="echo-btn" data-umami-event="Echo Szyfr" onclick="activateGlif()">Glif</button>

    <div class="inputs-container">
        <input type="text" class="code-input" maxlength="1" data-index="0">
        <input type="text" class="code-input" maxlength="1" data-index="1">
        <input type="text" class="code-input" maxlength="1" data-index="2">
        <input type="text" class="code-input" maxlength="1" data-index="3">
    </div>
</div>

<audio id="zapadniaSound"><source src="Zapadnia.mp3" type="audio/mpeg"></audio>
<audio id="glosSound"><source src="Glos_Serca_Siczy.mp3" type="audio/mpeg"></audio>

<script>
    let narratorAudio = null;
    const inputs = document.querySelectorAll('.code-input');
    const body = document.getElementById('body-main');

    // --- Obsługa Narratora ---
    function playNarrator() {
        const btn = document.getElementById("narratorBtn");
        if (!narratorAudio) {
            narratorAudio = new Audio("Zaglebienie.mp3");
            narratorAudio.onended = () => { btn.innerText = "🎙️ Narrator (Start)"; };
        }
        if (narratorAudio.paused) {
            narratorAudio.play().then(() => btn.innerText = "⏸️ Narrator (Pauza)").catch(() => alert("Brak pliku Zaglebienie.mp3!"));
        } else {
            narratorAudio.pause(); btn.innerText = "▶️ Narrator (Wznów)";
        }
    }

    // --- Obsługa Glifa (Tylko dźwięk) ---
    function activateGlif() {
        const sound = document.getElementById('glosSound');
        if (sound) {
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Brak pliku audio Glif"));
        }
        // Opcjonalnie: lekki wstrząs przy kliknięciu Glifa
        const btn = document.getElementById('echo-btn');
        btn.style.transform = "scale(0.95)";
        setTimeout(() => btn.style.transform = "scale(1)", 200);
    }

    // --- Logika Inputów ---
    inputs.forEach((input, index) => {
        // Obsługa wpisywania
        input.addEventListener('input', (e) => {
            // ZMIANA NA MAŁE LITERY
            e.target.value = e.target.value.toLowerCase();

            // Przejście do następnego pola
            if (e.target.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }

            // Sprawdzenie hasła po każdym znaku
            checkCode();
        });

        // Obsługa Backspace (cofanie)
        input.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && input.value === "" && index > 0) {
                inputs[index - 1].focus();
            }
        });
        
        // Obsługa wklejania
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasteData = (e.clipboardData || window.clipboardData).getData('text').toLowerCase();
            let currentIndex = index;
            
            for (let char of pasteData) {
                if (currentIndex < inputs.length) {
                    inputs[currentIndex].value = char;
                    currentIndex++;
                }
            }
            checkCode();
            if (currentIndex < inputs.length) inputs[currentIndex].focus();
        });
    });

    // --- Sprawdzanie hasła ---
    function checkCode() {
        const code = Array.from(inputs).map(i => i.value).join('');
        
        // Warunek: okon lub okoń (małe litery)
        if (code === "okon" || code === "okoń") {
            triggerSuccess();
        }
    }

    // --- Efekt Sukcesu (Zapadnia) ---
    function triggerSuccess() {
        // Zablokuj inputy
        inputs.forEach(i => i.disabled = true);
        
        // 1. Uruchom trzęsienie ekranu
        body.classList.add('shake-active');
        
        // 2. Odtwórz dźwięk zapadni
        const audio = document.getElementById('zapadniaSound');
        if (audio) {
            audio.play().catch(e => console.log("Błąd audio zapadni:", e));
        }

        // 3. Efekt wizualny (ściemnienie) i przekierowanie
        setTimeout(() => {
            // Po 1.5 sekundy trzęsienia -> wygaszanie do czerni
            document.getElementById('flash').style.opacity = "1";
            
            setTimeout(() => { 
                // Przekierowanie
                window.location.href = "https://andigaw.github.io/Siajnok/ciemnosc.html"; 
            }, 2000);
        }, 1500);
    }
</script>
</body>
</html>
