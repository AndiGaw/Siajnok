<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">
<title>Echo Przeszłości</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* ===== STYL BAZOWY ===== */
    html, body {
        margin: 0; padding: 0; 
        height: 100vh; 
        background: #000;
        color: #e6c47a; 
        font-family: "Georgia", serif;
        overflow: hidden; /* Zapobiega paskom przewijania przy pozycjonowaniu absolutnym */
        display: flex; 
        flex-direction: column; 
        align-items: center;
        position: relative;
    }

    /* ===== TŁO I PIASEK ===== */
    .sand {
        position: fixed;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
            45deg,
            rgba(230,196,122,0.15), 
            rgba(230,196,122,0.15) 2px,
            rgba(0,0,0,0) 6px
        );
        animation: drift 60s linear infinite;
        pointer-events: none;
        z-index: 1;
    }

    @keyframes drift {
        from { background-position: 0 0; }
        to { background-position: 1000px 1000px; }
    }

    /* ===== PRZYCISKI (STYL WSPÓLNY) ===== */
    .dune-btn {
        background: #111; 
        color: #e6c47a; 
        border: 2px solid #e6c47a;
        border-radius: 8px;
        padding: 15px 30px; 
        font-family: "Georgia", serif;
        font-size: 1.1em; 
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(230, 196, 122, 0.2);
        transition: all 0.3s ease;
        z-index: 10;
        text-decoration: none;
    }

    .dune-btn:hover {
        background: #e6c47a;
        color: #000;
        box-shadow: 0 0 30px rgba(230, 196, 122, 0.6);
    }

    /* ===== ROZMIESZCZENIE ELEMENTÓW ===== */
    
    /* 1. Narrator na górze */
    #top-bar {
        position: relative;
        z-index: 10;
        margin-top: 40px;
        margin-bottom: auto; /* Wypycha resztę w dół */
    }

    /* 2. Ukryta zapadnia po prawej */
    #right-panel {
        position: absolute;
        right: 5%;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
    }

    /* 3. Pola tekstowe pośrodku */
    #center-stage {
        z-index: 10;
        margin-bottom: auto; /* Wypycha od dołu, centrując wertykalnie razem z margin-top */
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding-bottom: 100px; /* Korekta optyczna */
    }

    .input-group {
        display: flex;
        gap: 15px;
    }

    .code-input {
        width: 60px;
        height: 80px;
        background: #000;
        border: 3px solid #5a4422; /* Ciemniejsze złoto */
        color: #e6c47a;
        font-family: "Georgia", serif;
        font-size: 3em;
        text-align: center;
        border-radius: 8px;
        outline: none;
        text-transform: uppercase;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .code-input:focus {
        border-color: #e6c47a;
        box-shadow: 0 0 20px rgba(230, 196, 122, 0.4);
    }

    h2 {
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 1.2em;
        opacity: 0.8;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(230,196,122,0.3);
    }

    /* ===== CUSTOM ALERT MODAL ===== */
    #custom-modal {
        display: none;
        position: fixed;
        z-index: 100;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.85);
        backdrop-filter: blur(2px);
        justify-content: center;
        align-items: center;
    }

    #modal-content {
        background-color: #111;
        border: 3px solid #e6c47a;
        box-shadow: 0 0 30px rgba(230,196,122,0.4);
        padding: 40px;
        text-align: center;
        max-width: 400px;
        border-radius: 10px;
        color: #e6c47a;
    }

    #modal-text {
        font-size: 1.3em;
        margin-bottom: 20px;
        line-height: 1.5;
    }

    /* Responsywność dla urządzeń mobilnych */
    @media (max-width: 768px) {
        #right-panel {
            position: relative;
            right: auto;
            top: auto;
            transform: none;
            margin-top: 30px;
        }
        .code-input {
            width: 50px;
            height: 70px;
            font-size: 2.5em;
        }
    }
</style>
</head>
<body>

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PB6TX54M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div class="sand"></div>

    <div id="top-bar">
        <button id="narratorBtn" class="dune-btn" onclick="playNarrator()">
            🎙️ Narrator (Start)
        </button>
    </div>

    <div id="center-stage">
        <h2>Podaj Hasło</h2>
        <div class="inputs-container">
            <div class="input-group">
                <input type="text" class="code-input" maxlength="1" data-index="0">
                <input type="text" class="code-input" maxlength="1" data-index="1">
                <input type="text" class="code-input" maxlength="1" data-index="2">
                <input type="text" class="code-input" maxlength="1" data-index="3">
            </div>
        </div>
    </div>

    <div id="right-panel">
        <button class="dune-btn" onclick="triggerTrapdoor()">
            Ukryta zapadnia
        </button>
    </div>

    <div id="custom-modal">
        <div id="modal-content">
            <div id="modal-text">Komunikat</div>
            <button class="dune-btn" onclick="closeModal()">Zamknij</button>
        </div>
    </div>

    <script>
        // ================= AUDIO (NARRATOR) =================
        let narratorAudio = null;
        function playNarrator() {
            const btn = document.getElementById("narratorBtn");
            
            // Tutaj wpisz nazwę pliku mp3, jeśli masz konkretny
            const audioFile = "Saper_Diuny.mp3"; 

            if (!narratorAudio) {
                narratorAudio = new Audio(audioFile);
                narratorAudio.addEventListener('ended', () => {
                    btn.innerText = "🎙️ Narrator (Start)";
                    narratorAudio.currentTime = 0;
                });
                // Obsługa błędu braku pliku
                narratorAudio.addEventListener('error', () => {
                   showModal("Błąd: Brak pliku audio (Saper_Diuny.mp3)");
                });
            }

            if (narratorAudio.paused) {
                narratorAudio.play().then(() => {
                    btn.innerText = "⏸️ Narrator (Pauza)";
                }).catch(err => {
                    console.log(err);
                    showModal("Nie można odtworzyć dźwięku. Sprawdź plik.");
                });
            } else {
                narratorAudio.pause();
                btn.innerText = "▶️ Narrator (Wznów)";
            }
        }

        // ================= INPUT LOGIC (OKON / OKOŃ) =================
        const inputs = document.querySelectorAll('.code-input');

        inputs.forEach((input, index) => {
            // 1. Obsługa wpisywania
            input.addEventListener('input', (e) => {
                const val = e.target.value.toUpperCase();
                e.target.value = val; // Wymuś wielką literę

                if (val.length === 1) {
                    // Przejdź do następnego pola
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    // Sprawdź hasło po każdym wpisaniu
                    checkPassword();
                }
            });

            // 2. Obsługa Backspace (cofanie)
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
            
            // 3. Obsługa wklejenia całego słowa
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text').toUpperCase();
                // Rozdziel tekst na inputy
                for (let i = 0; i < inputs.length; i++) {
                    if (pasteData[i]) {
                        inputs[i].value = pasteData[i];
                    }
                }
                checkPassword();
                // Ustaw focus na ostatnim wypełnionym
                const focusIndex = Math.min(inputs.length - 1, pasteData.length - 1);
                if (focusIndex >= 0) inputs[focusIndex].focus();
            });
        });

        function checkPassword() {
            let code = '';
            inputs.forEach(input => code += input.value);

            // Sprawdzenie warunku OKON lub OKOŃ
            if (code === 'OKON' || code === 'OKOŃ') {
                // Efekt sukcesu (opcjonalnie)
                inputs.forEach(input => {
                    input.style.borderColor = '#fff';
                    input.style.backgroundColor = '#221a0a';
                });
                
                // Przekierowanie
                setTimeout(() => {
                    window.location.href = "https://www.www.www";
                }, 300);
            }
        }

        // ================= UKRYTA ZAPADNIA =================
        function triggerTrapdoor() {
            // Tu możesz wpisać inną logikę, np. przekierowanie gdzie indziej
            showModal("Podłoga drży... Ale nic się nie dzieje. Może brakuje klucza?");
        }

        // ================= MODAL SYSTEM =================
        function showModal(text) {
            const modal = document.getElementById("custom-modal");
            document.getElementById("modal-text").innerText = text;
            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById("custom-modal").style.display = "none";
        }
    </script>

</body>
</html>
