    <meta charset="UTF-8">
<title>Melanż</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* ===== STYL BAZOWY ===== */
    html, body {
        margin: 0; padding: 0; 
        height: 100vh; 
        background-color: #000000; /* Czysta czerń */
        /* Zachowujemy sciana.png jako teksturę, ale tło pod spodem jest czarne */
        background-image: url('sciana.png'); 
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #e6c47a; 
        font-family: "Georgia", serif;
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
        align-items: center;
        justify-content: flex-start; 
        position: relative;
        width: 100%;
    }

    /* ===== SAND EFFECT (Diuna Vibe) ===== */
    .sand { 
        position: fixed; width: 100%; height: 100%; 
        /* Subtelniejszy piasek na czarnym tle */
        background: repeating-linear-gradient(45deg, rgba(194, 142, 14, 0.05), rgba(0,0,0,0) 3px); 
        pointer-events: none; z-index: 1; 
        animation: sand-drift 25s linear infinite;
    }

    @keyframes sand-drift {
        0% { background-position: 0 0; }
        100% { background-position: 100px 100px; }
    }

    /* ===== UI ELEMENTS ===== */
    #top-controls { 
        position: relative; 
        z-index: 10; 
        margin-top: 50px; 
        margin-bottom: 20px;
    }
    
    .ui-btn { 
        font-size: 1.2em; 
        padding: 12px 25px; 
        background: #111; 
        color: #e6c47a; 
        border: 2px solid #e6c47a; 
        cursor: pointer; 
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(230, 196, 122, 0.2);
        transition: 0.3s;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .ui-btn:hover {
        background: #222;
        box-shadow: 0 0 25px rgba(230, 196, 122, 0.4);
    }

    /* ===== CENTRUM - MELANZ ===== */
    .main-layout { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-grow: 1; 
        width: 100%;
        z-index: 5; 
        padding-bottom: 100px; 
    }

    #melanz-container {
        position: relative;
        width: 320px; 
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #melanz-img {
        max-width: 100%;
        max-height: 100%;
        transition: all 2s ease;
        
        /* STAN POCZĄTKOWY (ZABLOKOWANY): */
        filter: brightness(0.8); /* Tylko lekko przygaszony, ale w kolorze! */
        opacity: 0.8;
        cursor: default; /* Kursor domyślny (strzałka), nie rączka */
    }

    /* STAN AKTYWNY (ODBLOKOWANY): */
    #melanz-img.active {
        filter: brightness(1.1) drop-shadow(0 0 25px rgba(0, 153, 255, 0.5)); /* Błękitna poświata Przyprawy */
        opacity: 1;
        cursor: pointer; /* Pojawia się rączka */
        animation: pulse-spice 4s infinite alternate;
    }

    #melanz-img.active:hover {
        transform: scale(1.05);
        filter: brightness(1.3) drop-shadow(0 0 40px rgba(0, 153, 255, 0.8));
    }

    @keyframes pulse-spice {
        0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 153, 255, 0.4)); }
        100% { transform: scale(1.03); filter: drop-shadow(0 0 30px rgba(0, 153, 255, 0.7)); }
    }

    /* Flash efekt przy przejściu */
    #flash { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #fff; opacity: 0; pointer-events: none; z-index: 100; 
        transition: opacity 1.5s; 
    }

</style>
</head>
<body>

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PB6TX54M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    
    <div class="sand"></div>
    <div id="flash"></div>

    <div id="top-controls">
        <button id="narratorBtn" data-umami-event="Ekstrakt Narrator" class="ui-btn" onclick="playNarrator()">🎙️ Narrator (Start)</button>
    </div>

    <div class="main-layout">
        <div id="melanz-container">
            <img src="Melanz.png" id="melanz-img" alt="Melanż" data-umami-event="Melanz Klik">
        </div>
    </div>

<script>
    let narratorAudio = null;
    const narratorBtn = document.getElementById("narratorBtn");
    const melanzImg = document.getElementById("melanz-img");
    let isUnlocked = false;

    // --- Obsługa Narratora ---
    function playNarrator() {
        if (!narratorAudio) {
            narratorAudio = new Audio("Ekstrakt_przyprawowy.mp3");
            
            // Zdarzenie: Koniec odtwarzania -> ODBLOKOWANIE
            narratorAudio.onended = () => { 
                narratorBtn.innerText = "🎙️ Narrator (Zakończono)"; 
                unlockMelanz(); 
            };
        }

        if (narratorAudio.paused) {
            narratorAudio.play()
                .then(() => narratorBtn.innerText = "⏸️ Narrator (Pauza)")
                .catch(err => {
                    console.error(err);
                    alert("Błąd: Upewnij się, że plik Ekstrakt_przyprawowy.mp3 jest w folderze.");
                });
        } else {
            narratorAudio.pause(); 
            narratorBtn.innerText = "▶️ Narrator (Wznów)";
        }
    }

    // --- Odblokowanie Melanżu ---
    function unlockMelanz() {
        if (isUnlocked) return;
        isUnlocked = true;
        
        melanzImg.classList.add('active'); // Dodaje poświatę i kursor
    }

    // --- Logika Kliknięcia w Melanż ---
    melanzImg.addEventListener('click', (e) => {
        if (!isUnlocked) {
            // ZABLOKOWANE: Nic nie rób (lub subtelny efekt "brak dostępu")
            e.preventDefault();
            // Lekkie drgnięcie, żeby użytkownik wiedział, że przycisk "żyje" ale jest zablokowany
            melanzImg.style.transform = "translateX(-3px)";
            setTimeout(() => melanzImg.style.transform = "translateX(3px)", 100);
            setTimeout(() => melanzImg.style.transform = "translateX(0)", 200);
            return; 
        }

        // ODBLOKOWANE: Przekierowanie
        goToFuture();
    });

    // --- Przekierowanie ---
    function goToFuture() {
        // Efekt wizualny (Wizja)
        document.getElementById('flash').style.opacity = "0.9";
        
        // Przekierowanie
        setTimeout(() => {
            window.location.href = "https://andigaw.github.io/Siajnok/wizja_przyszlosci.html";
        }, 1200);
    }

</script>
</body>
</html>
