    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serce Siczy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-image: url('Piasek_szeroki.png');
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000; 
            overflow: hidden;
            
            /* ===== ZMIANY UKŁADU (TOP CENTER) ===== */
            display: flex;
            flex-direction: column; /* Układ pionowy */
            align-items: center;    /* Wyśrodkowanie w poziomie */
            justify-content: flex-start; /* Elementy od góry */
            padding-top: 50px;      /* Odstęp od górnej krawędzi */
        }

        /* ===== STYL PRZYCISKU (Zachowany styl Serca Siczy) ===== */
        .audio-btn {
            background: #111; 
            color: #e6c47a; 
            border: 3px solid #e6c47a;
            border-radius: 8px;
            padding: 20px 30px; 
            font-family: "Georgia", serif;
            font-size: 1.2em; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(230, 196, 122, 0.3);
            transition: all 0.3s ease;
            z-index: 10;
            min-width: 280px; 
            text-align: center;
            text-decoration: none; /* Usunięcie podkreślenia dla linku */
            display: inline-block;
        }

        .audio-btn:hover {
            background: #e6c47a;
            color: #000;
            box-shadow: 0 0 40px rgba(230, 196, 122, 0.6);
        }

        /* ===== NOWY PRZYCISK ABCD ===== */
        #nextStepBtn {
            display: none; /* Domyślnie ukryty */
            position: absolute;
            right: 5%;      /* Margines od prawej krawędzi */
            bottom: 25%;    /* 20% od dołu ekranu */
            animation: fadeIn 2s forwards; /* Powolne pojawianie się */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Efekt ziarnistego piasku w tle */
        .sand-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(230,196,122,0.05), rgba(0,0,0,0) 6px);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PB6TX54M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    
    <div class="sand-overlay"></div>

    <button id="narratorBtn" 
            class="audio-btn" 
            data-umami-event="Aktywacja Serca Siczy" 
            onclick="playNarrator()">
        🎙️ Narrator (Start)
    </button>
    
    <a id="nextStepBtn" href="https://andigaw.github.io/Siajnok/echo.html" class="audio-btn">
        Podejdź
    </a>
    
    <script>
        let narratorAudio = null;

        function playNarrator() {
            const btn = document.getElementById("narratorBtn");
            const nextBtn = document.getElementById("nextStepBtn");

            // Tworzymy obiekt Audio tylko raz, przy pierwszym kliknięciu
            if (!narratorAudio) {
                // Podmiana pliku na właściwy dla tej podstrony
                narratorAudio = new Audio("Piaskowa_pieczara.mp3");
                
                // GDY NAGRANIE SIĘ SKOŃCZY:
                narratorAudio.onended = () => {
                    btn.innerText = "🎙️ Narrator (Start)";
                    
                    // Pokaż przycisk Podejdź
                    nextBtn.style.display = "block";
                };
            }

            // Logika Pauza / Start
            if (narratorAudio.paused) {
                narratorAudio.play().then(() => {
                    btn.innerText = "⏸️ Narrator (Pauza)";
                }).catch(error => {
                    console.log("Odtwarzanie zablokowane lub brak pliku.", error);
                    alert("Błąd: Nie można odtworzyć pliku mp3");
                });
            } else {
                narratorAudio.pause();
                btn.innerText = "▶️ Narrator (Wznów)";
            }
        }
    </script>

</body>
</html>
