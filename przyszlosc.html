<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizja przyszłości</title>
    <style>
        /* Reset ustawień i czarne tło */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Kontener główny */
        .container {
            display: flex;
            justify-content: center; /* Wyśrodkowanie */
            gap: 50px; /* Odstęp między filmami */
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        /* Stylizacja okien wideo - PIONOWE (9:16) */
        .video-wrapper {
            height: 85vh; /* Wysokość na 85% ekranu */
            aspect-ratio: 9 / 16; /* Proporcje pionowe */
            position: relative;
            background-color: #111;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: border-color 0.3s, transform 0.2s;
        }

        .video-wrapper:hover {
            border-color: #777;
            transform: scale(1.02);
        }

        /* Przycisk startu / Zaślepka */
        .play-button {
            position: absolute;
            color: white;
            font-size: 1.2rem;
            border: 1px solid white;
            padding: 15px 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            width: 80%;
            pointer-events: none;
        }

        /* Wideo domyślnie ukryte */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Pokazywanie wideo po aktywacji */
        .video-wrapper.active video {
            display: block;
        }
        .video-wrapper.active .play-button {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="background-audio" loop>
        <source src="Szepty.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <div class="video-wrapper" onclick="playVideo(this)">
            <div class="play-button">Start<br>Zagłada</div>
            <video src="Zaglada.mp4" loop playsinline></video>
        </div>

        <div class="video-wrapper" onclick="playVideo(this)">
            <div class="play-button">Start<br>Złoty Szlak</div>
            <video src="Zloty_szlak.mp4" loop playsinline></video>
        </div>

    </div>

    <script>
        // --- KONFIGURACJA AUDIO ---
        const audio = document.getElementById('background-audio');
        
        // USTAWIENIE GŁOŚNOŚCI NA 50%
        audio.volume = 0.5; 

        // --- CZĘŚĆ 1: Obsługa Wideo ---
        function playVideo(element) {
            if (element.classList.contains('active')) return;

            // Pokazujemy wideo
            element.classList.add('active');
            const video = element.querySelector('video');
            video.play();
            
            // Próbujemy odpalić tło muzyczne
            tryStartAudio(); 
        }

        // --- CZĘŚĆ 2: Obsługa Startu Audio ---
        function tryStartAudio() {
            if (audio.paused) {
                audio.play().catch(err => {
                    console.log("Czekam na interakcję użytkownika...");
                });
            }
        }

        // Próba uruchomienia dźwięku po 3 sekundach
        window.addEventListener('load', () => {
            setTimeout(() => {
                tryStartAudio();
            }, 3000);
        });
    </script>

</body>
</html>
