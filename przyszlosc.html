<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizja przyszłości</title>
    <style>
        /* Reset i tło */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Główny kontener */
        .container {
            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: center;
            height: 100vh;
            width: 100%;
            transition: opacity 0.5s; /* Płynne znikanie tła */
        }

        /* PIONOWE OKNA (9:16) - Stan domyślny */
        .video-wrapper {
            height: 85vh;
            aspect-ratio: 9 / 16;
            position: relative;
            background-color: #111;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease-in-out; /* Płynna animacja powiększania */
            z-index: 1;
        }

        .video-wrapper:hover {
            border-color: #777;
            transform: scale(1.02);
        }

        /* --- TRYB PEŁNOEKRANOWY (Klasa dodawana przez JS) --- */
        .video-wrapper.expanded {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000; /* Musi być na samym wierzchu */
            border: none;
            transform: none !important; /* Resetuje efekt hover */
            background-color: black;
        }

        /* Wideo w trybie pełnoekranowym */
        .video-wrapper.expanded video {
            /* 'contain' sprawi, że widać CAŁY pionowy film na środku ekranu. 
               Jeśli wolisz, żeby wypełnił ekran (ucinając górę/dół), zmień na 'cover' */
            object-fit: contain; 
        }

        /* Przycisk START */
        .play-button {
            position: absolute;
            color: white;
            font-size: 1.2rem;
            border: 1px solid white;
            padding: 15px 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            width: 80%;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* Przycisk ZAMKNIJ (X) - widoczny tylko w trybie expanded */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            display: none; /* Domyślnie ukryty */
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .close-btn:hover {
            opacity: 1;
        }

        /* Wideo */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* W małym oknie wypełnia całość */
            display: none;
        }

        /* Aktywne stany */
        .video-wrapper.active video {
            display: block;
        }
        .video-wrapper.active .play-button {
            display: none;
        }
        /* Pokaz X tylko gdy jest expanded */
        .video-wrapper.expanded .close-btn {
            display: block;
        }

    </style>
</head>
<body>

    <audio id="background-audio" loop>
        <source src="Szepty.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <div class="video-wrapper" onclick="expandVideo(this)">
            <div class="close-btn" onclick="closeVideo(event, this)">×</div>
            <div class="play-button">Start<br>Zagłada</div>
            <video src="Zaglada.mp4" loop playsinline></video>
        </div>

        <div class="video-wrapper" onclick="expandVideo(this)">
            <div class="close-btn" onclick="closeVideo(event, this)">×</div>
            <div class="play-button">Start<br>Złoty Szlak</div>
            <video src="Zloty_szlak.mp4" loop playsinline></video>
        </div>

    </div>

    <script>
        // --- AUDIO ---
        const audio = document.getElementById('background-audio');
        audio.volume = 0.5;

        // Hack na start audio przy pierwszym kliknięciu gdziekolwiek
        document.body.addEventListener('click', function() {
            if (audio.paused) audio.play().catch(e => {});
        }, { once: true });


        // --- OBSŁUGA ROZWIJANIA WIDEO ---
        function expandVideo(wrapper) {
            // Jeśli już jest otwarte, kliknięcie w wideo robi Play/Pause
            if (wrapper.classList.contains('expanded')) {
                const video = wrapper.querySelector('video');
                if (video.paused) video.play(); else video.pause();
                return;
            }

            // 1. Zresetuj inne filmy
            document.querySelectorAll('.video-wrapper').forEach(w => {
                w.classList.remove('expanded', 'active');
                w.querySelector('video').pause();
                w.querySelector('video').currentTime = 0; // Opcjonalnie: przewiń do początku
            });

            // 2. Aktywuj kliknięty
            wrapper.classList.add('active');   // Pokazuje wideo, chowa napis Start
            wrapper.classList.add('expanded'); // Rozciąga na pełny ekran
            
            const video = wrapper.querySelector('video');
            video.play();
        }

        // --- OBSŁUGA ZAMYKANIA (X) ---
        function closeVideo(event, btn) {
            // Zatrzymaj propagację, żeby kliknięcie w X nie uruchomiło funkcji expandVideo (która jest pod spodem)
            event.stopPropagation();

            // Znajdź rodzica (video-wrapper)
            const wrapper = btn.parentElement;
            const video = wrapper.querySelector('video');

            // Wyłącz wideo i wyjdź z pełnego ekranu
            video.pause();
            wrapper.classList.remove('expanded');
            // Zostawiamy klasę 'active', żeby nie wracał napis START od razu,
            // albo usuwamy 'active' jeśli chcesz, żeby wrócił napis START:
            // wrapper.classList.remove('active'); 
        }

        // Timeout na audio (jeśli user był aktywny wcześniej)
        setTimeout(() => {
            if (audio.paused) audio.play().catch(e => {});
        }, 3000);

    </script>

</body>
</html>
