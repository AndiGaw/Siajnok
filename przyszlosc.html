<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizja przyszłości</title>
    <style>
        /* Reset ustawień i czarne tło */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Kontener główny */
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        /* Stylizacja okien wideo */
        .video-wrapper {
            width: 45%;
            max-width: 800px;
            /* Ustawiamy proporcje 16:9, żeby okno miało kształt przed załadowaniem */
            aspect-ratio: 16 / 9;
            position: relative;
            background-color: #111; /* Ciemne tło zanim wideo ruszy */
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: border-color 0.3s;
        }

        .video-wrapper:hover {
            border-color: #777;
        }

        /* Przycisk startu / Zaślepka */
        .play-button {
            position: absolute;
            color: white;
            font-size: 1.5rem;
            border: 2px solid white;
            padding: 10px 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            pointer-events: none; /* Kliknięcie przenika do wrappera */
        }

        /* Wideo domyślnie ukryte */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Ukryte dopóki nie klikniemy */
        }

        /* Klasa dodawana po kliknięciu - pokazuje wideo, ukrywa przycisk */
        .video-wrapper.active video {
            display: block;
        }
        .video-wrapper.active .play-button {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="background-audio" loop>
        <source src="Szepty.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <div class="video-wrapper" onclick="playVideo(this)">
            <div class="play-button">Start: Zagłada</div>
            <video src="Zaglada.mp4" loop playsinline></video>
        </div>

        <div class="video-wrapper" onclick="playVideo(this)">
            <div class="play-button">Start: Złoty Szlak</div>
            <video src="Zloty_szlak.mp4" loop playsinline></video>
        </div>

    </div>

    <script>
        // --- CZĘŚĆ 1: Obsługa Wideo ---
        function playVideo(element) {
            // Jeśli wideo już gra, nic nie rób (lub można dodać pauzę)
            if (element.classList.contains('active')) return;

            // Dodaj klasę active (pokazuje tag video, ukrywa napis)
            element.classList.add('active');

            // Znajdź element <video> wewnątrz klikniętego diva i odpal go
            const video = element.querySelector('video');
            video.play();
            
            // Przy okazji upewnij się, że muzyka w tle gra (jeśli przeglądarka zablokowała auto-start)
            tryStartAudio(); 
        }

        // --- CZĘŚĆ 2: Obsługa Audio (Szepty.mp3) ---
        const audio = document.getElementById('background-audio');

        function tryStartAudio() {
            if (audio.paused) {
                audio.play().catch(err => {
                    console.log("Przeglądarka zablokowała audio (czeka na kliknięcie).");
                });
            }
        }

        // Próba uruchomienia dźwięku po 3 sekundach od wejścia
        window.addEventListener('load', () => {
            setTimeout(() => {
                // To zadziała tylko, jeśli użytkownik w ciągu tych 3 sekund
                // kliknął gdziekolwiek na stronie. Jeśli nie, przeglądarka zablokuje
                // i dźwięk ruszy dopiero przy kliknięciu w wideo (dzięki funkcji tryStartAudio).
                tryStartAudio();
            }, 3000);
        });
    </script>

</body>
</html>
