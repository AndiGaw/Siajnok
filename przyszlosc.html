<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizja przyszłości</title>
    <style>
        /* Reset i tło */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Główny kontener */
        .container {
            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        /* PIONOWE OKNA (9:16) */
        .video-wrapper {
            height: 85vh; /* 85% wysokości ekranu */
            aspect-ratio: 9 / 16; /* Format pionowy */
            position: relative;
            background-color: #111;
            border: 1px solid #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: border-color 0.3s, transform 0.2s;
        }

        .video-wrapper:hover {
            border-color: #777;
            transform: scale(1.01);
        }

        /* Przycisk START (znika po aktywacji) */
        .play-button {
            position: absolute;
            color: white;
            font-size: 1.2rem;
            border: 1px solid white;
            padding: 15px 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            width: 80%;
            pointer-events: none; /* Kliknięcie przechodzi niżej */
        }

        /* Wideo */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Ukryte na początku */
        }

        /* Klasa .active włącza widoczność wideo */
        .video-wrapper.active video {
            display: block;
        }
        .video-wrapper.active .play-button {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="background-audio" loop>
        <source src="Szepty.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <div class="video-wrapper" onclick="toggleVideo(this)">
            <div class="play-button">Start<br>Zagłada</div>
            <video src="Zaglada.mp4" loop playsinline></video>
        </div>

        <div class="video-wrapper" onclick="toggleVideo(this)">
            <div class="play-button">Start<br>Złoty Szlak</div>
            <video src="Zloty_szlak.mp4" loop playsinline></video>
        </div>

    </div>

    <script>
        // --- KONFIGURACJA AUDIO ---
        const audio = document.getElementById('background-audio');
        audio.volume = 0.5; // Głośność tła: 50%

        // --- FUNKCJA OBSŁUGUJĄCA WIDEO (START / PAUZA / WZNOWIENIE) ---
        function toggleVideo(element) {
            const video = element.querySelector('video');

            // Scenariusz 1: Pierwsze kliknięcie (Aktywacja)
            if (!element.classList.contains('active')) {
                element.classList.add('active'); // Chowa napis, pokazuje wideo
                video.play();
                
                // Przy okazji próbujemy włączyć tło muzyczne
                tryStartAudio();
            } 
            // Scenariusz 2: Kolejne kliknięcia (Pauza / Play)
            else {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        }

        // --- OBSŁUGA STARTU AUDIO TŁA ---
        function tryStartAudio() {
            if (audio.paused) {
                audio.play().catch(err => {
                    console.log("Audio tła czeka na interakcję...");
                });
            }
        }

        // Próba auto-startu audio po 3 sekundach
        window.addEventListener('load', () => {
            setTimeout(() => {
                tryStartAudio();
            }, 3000);
        });
    </script>

</body>
</html>
