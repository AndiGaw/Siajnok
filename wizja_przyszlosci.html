<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizja Przyszłości</title>
    <style>
        /* --- STYLIZACJA OGÓLNA --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Techniczny klimat */
            color: white;
        }

        /* Kontener centrujący (używany do tekstów i przycisku) */
        .center-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10; /* Teksty są nad wideo */
            pointer-events: none; /* Żeby kliki przechodziły, chyba że to przycisk */
        }

        /* --- PRZYCISK STARTOWY --- */
        #start-btn {
            font-size: 2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid white;
            padding: 20px 40px;
            transition: all 0.5s;
            pointer-events: auto; /* Przycisk musi być klikalny */
            background: rgba(0,0,0,0.5);
        }

        #start-btn:hover {
            background: white;
            color: black;
            letter-spacing: 6px;
        }

        /* --- NAPISY MIĘDZY FILMAMI --- */
        #message-text {
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-align: center;
            opacity: 0; /* Domyślnie niewidoczny */
            transition: opacity 2s ease-in-out; /* Płynne pojawianie się przez 2s */
        }

        /* --- WIDEO (PEŁNY EKRAN) --- */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 'contain' = widać całe wideo pionowe na czarnym tle. 
               'cover' = utnie górę/dół, ale wypełni ekran. 
               Zalecam 'contain' dla pionowych filmów na monitorze PC */
            object-fit: contain; 
            z-index: 5;
            display: none; /* Domyślnie ukryte */
            background: black;
        }

        /* Klasa pomocnicza do ukrywania elementów */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <audio id="bg-audio" loop>
        <source src="Szepty.mp3" type="audio/mpeg">
    </audio>

    <div class="center-container">
        <div id="start-btn">Wkrocz w wizję</div>
        <div id="message-text"></div>
    </div>

    <video id="video1" src="Zaglada.mp4" playsinline></video>
    <video id="video2" src="Zloty_szlak.mp4" playsinline></video>

    <script>
        // --- KONFIGURACJA ---
        const audio = document.getElementById('bg-audio');
        const startBtn = document.getElementById('start-btn');
        const messageEl = document.getElementById('message-text');
        const vid1 = document.getElementById('video1');
        const vid2 = document.getElementById('video2');

        // Ustaw głośność szumu
        audio.volume = 0.5;

        // --- SEKWENCJA ZDARZEŃ ---

        // 1. START: Kliknięcie w przycisk
        startBtn.addEventListener('click', () => {
            // Ukryj przycisk
            startBtn.classList.add('hidden');
            
            // Włącz dźwięk
            audio.play().then(() => {
                // Rozpocznij odliczanie 5 sekund w czerni
                setTimeout(sequenceStep1, 5000);
            }).catch(e => console.log("Audio error:", e));
        });

        // 2. KROK PIERWSZY: Wyświetl napis "Świat bez Złotego Szlaku"
        function sequenceStep1() {
            showMessage("Świat bez Złotego Szlaku");

            // Napis świeci przez 3 sekundy, potem startuje film
            setTimeout(() => {
                hideMessage();
                playVideo1();
            }, 4000); 
        }

        // 3. START FILMU 1 (Zagłada)
        function playVideo1() {
            vid1.style.display = 'block';
            vid1.play();

            // Gdy film się skończy, idź do kroku 4
            vid1.onended = () => {
                vid1.style.display = 'none'; // Schowaj wideo
                sequenceStep2(); // Odpal przerwę
            };
        }

        // 4. KROK DRUGI: Przerwa 5 sekund po filmie
        function sequenceStep2() {
            // Czekamy 5 sekund w czerni (zgodnie z instrukcją)
            setTimeout(() => {
                showMessage("Złoty Szlak");
                
                // Napis świeci przez 3 sekundy, potem startuje film 2
                setTimeout(() => {
                    hideMessage();
                    playVideo2();
                }, 4000);

            }, 5000);
        }

        // 5. START FILMU 2 (Złoty Szlak)
        function playVideo2() {
            vid2.style.display = 'block';
            vid2.play();

            // Opcjonalnie: co po zakończeniu?
            vid2.onended = () => {
                // Możesz tu zostawić wideo na ostatniej klatce, 
                // albo schować i pokazać napisy końcowe.
                // Na razie: zostawiamy czarny ekran.
                vid2.style.display = 'none'; 
            };
        }

        // --- FUNKCJE POMOCNICZE DO TEKSTU ---
        function showMessage(text) {
            messageEl.innerText = text;
            messageEl.style.opacity = 1; // Fade in
        }

        function hideMessage() {
            messageEl.style.opacity = 0; // Fade out
        }

    </script>
</body>
</html>
