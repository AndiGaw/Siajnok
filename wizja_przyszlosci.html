    <meta charset="UTF-8">    
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizja Przyszłości: Arrakis</title>
    <style>
        /* --- STYLIZACJA OGÓLNA (DIUNA STYLE) --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #e6c47a; /* Złoto Diuny */
            font-family: "Georgia", serif;
            overflow: hidden;
        }

        /* --- EFEKT RUCHOMEGO PIASKU (Z Twojego kodu) --- */
        .sand {
            position: fixed;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                rgba(230,196,122,0.15),
                rgba(230,196,122,0.15) 2px,
                rgba(0,0,0,0) 6px
            );
            animation: drift 60s linear infinite;
            pointer-events: none; /* Żeby kliki przechodziły przez piasek */
            z-index: 1;
        }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

    /* --- KONTENER CENTRUJĄCY --- */
    .center-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        pointer-events: none;
        
        /* DODAJ TĘ LINIĘ: */
        flex-direction: column; /* Ustawia elementy jeden pod drugim, a nie obok siebie */
    }

        /* --- PRZYCISK STARTOWY (DIUNA STYLE) --- */
        #start-btn {
            font-size: 1.5rem;
            padding: 20px 50px;
            background: #111;
            color: #e6c47a;
            border: 2px solid #e6c47a;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(230,196,122,0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            pointer-events: auto;
            font-family: "Georgia", serif;
            font-weight: bold;
        }

        #start-btn:hover {
            background: #e6c47a;
            color: #000;
            box-shadow: 0 0 30px rgba(230,196,122,0.8);
            transform: scale(1.05);
        }

        /* --- NAPISY MIĘDZY FILMAMI --- */
        #message-text {
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-align: center;
            color: #e6c47a;
            text-shadow: 0 0 20px rgba(230,196,122,0.6);
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* --- WIDEO (PEŁNY EKRAN) --- */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Cały kadr widoczny */
            z-index: 5;
            display: none;
            background: black;
            cursor: pointer; /* Sygnalizuje, że można klikać */
        }

        /* Klasa pomocnicza */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="sand"></div>

    <audio id="bg-audio" loop>
        <source src="Szepty.mp3" type="audio/mpeg">
    </audio>

    <div class="center-container">
        <button id="start-btn" data-umami-event="Ekstrakt Narrator">Wkrocz w wizję</button>
        <div id="message-text"></div>
    </div>

    <video id="video1" src="Zaglada.mp4" playsinline onclick="togglePlayback(this)"></video>
    <video id="video2" src="Zloty_szlak.mp4" playsinline onclick="togglePlayback(this)"></video>

    <script>
        // --- KONFIGURACJA ---
        const audio = document.getElementById('bg-audio');
        const startBtn = document.getElementById('start-btn');
        const messageEl = document.getElementById('message-text');
        const vid1 = document.getElementById('video1');
        const vid2 = document.getElementById('video2');

        audio.volume = 0.5;

        // --- FUNKCJA START/STOP DLA WIDEO ---
        function togglePlayback(videoElement) {
            if (videoElement.paused) {
                videoElement.play();
            } else {
                videoElement.pause();
            }
        }

        // --- SEKWENCJA ZDARZEŃ ---

        // 1. START
        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');
            
            // Start Audio
            audio.play().then(() => {
                // 5 sekund ciemności i szumu
                setTimeout(sequenceStep1, 5000);
            }).catch(e => console.log("Audio error:", e));
        });

        // 2. NAPIS 1: Świat bez Złotego Szlaku
        function sequenceStep1() {
            showMessage("Świat bez Złotego Szlaku");

            // Czas na czytanie: 4 sekundy -> Start Video 1
            setTimeout(() => {
                hideMessage();
                playVideo1();
            }, 4000); 
        }

        // 3. WIDEO 1: Zagłada
        function playVideo1() {
            vid1.style.display = 'block';
            vid1.play();

            vid1.onended = () => {
                vid1.style.display = 'none';
                sequenceStep2(); 
            };
        }

        // 4. PRZERWA PO FILMIE 1
        function sequenceStep2() {
            // 5 sekund ciemności
            setTimeout(() => {
                showMessage("Złoty Szlak");
                
                // Czas na czytanie: 4 sekundy -> Start Video 2
                setTimeout(() => {
                    hideMessage();
                    playVideo2();
                }, 4000);

            }, 5000);
        }

        // 5. WIDEO 2: Złoty Szlak
        function playVideo2() {
            vid2.style.display = 'block';
            vid2.play();

            vid2.onended = () => {
                vid2.style.display = 'none';
                // Opcjonalnie: Koniec sekwencji, np. powrót menu
                startBtn.innerText = "Wybór zależy od Ciebie";
                startBtn.classList.remove('hidden');
                startBtn.onclick = () => location.reload();
            };
        }

        // --- FUNKCJE POMOCNICZE ---
        function showMessage(text) {
            messageEl.innerText = text;
            messageEl.style.opacity = 1;
        }

        function hideMessage() {
            messageEl.style.opacity = 0;
        }

    </script>
</body>
</html>
